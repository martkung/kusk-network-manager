<!DOCTYPE html>
<html lang="th">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Network Switch Manager</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/sidebar.css">
<link rel="stylesheet" href="../css/modal.css">

  <link rel="stylesheet" href="/css/branding.css">
</head>

<body>

<div id="sidebar-container"></div>

<div class="main-content">

    <h1 class="page-title">
        Network Switch Manager
    </h1>

    <!-- Dashboard Summary -->

<div class="row g-4 mb-4">

    <div class="col-md-3">

        <div class="card dashboard-card">

            <div class="card-body">

                <div class="card-title-small">
                    Total Switches
                </div>

                <div
                class="card-number"
                id="switchCount">

                0

                </div>

            </div>

        </div>

    </div>

    <div class="col-md-3">

        <div class="card dashboard-card">

            <div class="card-body">

                <div class="card-title-small">
                    Online
                </div>

                <div
                class="card-number text-success"
                id="onlineCount">

                0

                </div>

            </div>

        </div>

    </div>

    <div class="col-md-3">

        <div class="card dashboard-card">

            <div class="card-body">

                <div class="card-title-small">
                    Offline
                </div>

                <div
                class="card-number text-danger"
                id="offlineCount">

                0

                </div>

            </div>

        </div>

    </div>

    <div class="col-md-3">

        <div class="card dashboard-card">

            <div class="card-body">

                <div class="card-title-small">
                    Availability
                </div>

                <div
                class="card-number text-warning"
                id="availabilityPercent">

                0%

                </div>

            </div>

        </div>

    </div>

    </div>

    <!-- Header -->

    
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap">

    <h3>Switch List</h3>

        <div class="d-flex gap-2">

             <input
                    type="text"
                    autocomplete="username"
                    style="display:none">

            <input
                    type="password"
                    autocomplete="current-password"
                    style="display:none">   


            <input
                type="search"
                id="searchBox"
                class="form-control"
                placeholder="🔍 Search Name / IP / MAC / Brand"
                autocomplete="off"
                spellcheck="false"
                autocorrect="off"
                autocapitalize="off"
                style="width:300px;">

            <button
            class="btn btn-primary"
            onclick="newDevice()">

            + Add Device

            </button>

        </div>

    </div>

    <!-- Table -->

    <div class="table-container">

        <table
        class="table table-dark table-hover align-middle">

           <thead>
             <tr>
                <th>Name</th>
                <th>Brand</th>
                <th>Model</th>
                <th>IP Address</th>
                <th>MAC Address</th>
                <th>Status</th>
                <th>Config</th>
                <th>Actions</th>
             </tr>
            </thead>

            <tbody id="switchTable">

            </tbody>

        </table>

    </div>

</div>

<div id="modal-container"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="../js/sidebar.js"></script>

<script type="module"
src="../js/app.js">
</script>

<script type="module">

import { auth }
from "../js/firebase-config.js";

import {
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";

onAuthStateChanged(
auth,
(user)=>{

    if(!user){

        location.href =
        "../login.html";

    }

});

</script>

  <script src="/js/branding.js" defer></script>
</body>

</html>
