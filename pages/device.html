<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Device Detail</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/sidebar.css">

  <link rel="stylesheet" href="/css/branding.css">
</head>

<body>

<div id="sidebar-container"></div>

<div class="main-content">

<div class="d-flex justify-content-between align-items-center mb-4">

<h1 id="deviceName">
Loading...
</h1>

<a
href="../pages/switches.html"
class="btn btn-secondary">

Back

</a>

</div>

<div class="row g-4">

<!-- LEFT -->
<div class="col-lg-8">

<div class="card dashboard-card">

<div class="card-body">

<h5>General Information</h5>

<hr>

<div class="device-info-layout">

<!-- DEVICE INFO -->
<div class="device-info-left">

<p>
<strong>Brand :</strong>
<span id="deviceBrand"></span>
</p>

<p>
<strong>Model :</strong>
<span id="deviceModel"></span>
</p>

<p>
<strong>IP :</strong>
<span id="deviceIP"></span>
</p>

<p>
<strong>MAC :</strong>
<span id="deviceMAC"></span>
</p>

<p>
<strong>Username :</strong>
<span id="deviceUsername">-</span>
</p>

<p>
<strong>Password :</strong>
<span id="devicePassword">-</span>
</p>

<p>
<strong>Serial :</strong>
<span id="deviceSerial"></span>
</p>

<p>
<strong>Status :</strong>
<span id="deviceStatus"></span>
</p>

<p>
<strong>Location :</strong>
<span id="deviceLocation"></span>
</p>

</div>

   <!-- IMAGE -->
<div class="device-info-right">

<div class="location-image-title">
Location Image
</div>

<div class="location-image-box">

<img
id="locationImage"
src="https://placehold.co/600x400?text=No+Image"
alt="Location Image"
class="location-image"
>

</div>

<!-- GALLERY -->
<div
id="galleryContainer"
class="gallery-container">
</div>

<div class="upload-controls">

<input
type="file"
id="galleryUpload"
accept="image/*"
multiple
hidden
>

<input
type="file"
id="cameraUpload"
accept="image/*"
capture="environment"
multiple
hidden
>

<label
for="galleryUpload"
class="btn btn-primary w-100 mb-2">

🖼 เลือกรูปจาก Gallery

</label>

<label
for="cameraUpload"
class="btn btn-success w-100 mb-2">

📷 ถ่ายรูปใหม่

</label>

<button
id="uploadLocationBtn"
class="upload-btn">

⬆ Upload Image

</button>

</div>

</div>

</div>

</div>

</div>

</div>

<!-- RIGHT -->
<div class="col-lg-4">

<div class="card dashboard-card">

<div class="card-body">

<h5>Management</h5>

<hr>

<div class="d-grid gap-3">

<a
id="openConfig"
target="_blank"
class="btn btn-success">

Open Web Config

</a>



</div>

</div>

</div>

</div>

</div>

</div>

<script src="../js/sidebar.js"></script>

<script type="module"
src="../js/device.js">
</script>

  <script src="/js/branding.js" defer></script>
</body>

</html>
