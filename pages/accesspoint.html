<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Access Point</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/sidebar.css">

  <link rel="stylesheet" href="/css/branding.css">
</head>

<body>

<div id="sidebar-container"></div>

<div class="main-content">

    <h1 class="page-title mb-4">
        📶 Access Point Management
    </h1>

    <div class="row g-4">

        <!-- Zyxel -->

        <div class="col-md-4">

            <div class="card dashboard-card h-100">

                <div class="card-body text-center">

                    <h3>🟢 Zyxel</h3>

                    <a
                        href="https://nebula.zyxel.com/"
                        target="_blank"
                        class="btn btn-primary mt-3">

                        Open Config

                    </a>

                </div>

            </div>

        </div>

        <!-- UniFi -->

        <div class="col-md-4">

            <div class="card dashboard-card h-100">

                <div class="card-body text-center">

                    <h3>🔵 UniFi</h3>

                    <a
                        href="https://10.60.23.8:8443/manage/account/login?redirect=%2Fmanage"
                        target="_blank"
                        class="btn btn-primary mt-3">

                        Open Config

                    </a>

                </div>

            </div>

        </div>

        <!-- Cambium -->

        <div class="col-md-4">

            <div class="card dashboard-card h-100">

                <div class="card-body text-center">

                    <h3>🟠 Cambium</h3>

                    <a
                        href="https://cloud.cambiumnetworks.com/#/"
                        target="_blank"
                        class="btn btn-warning mt-3">

                        Open Config

                    </a>

                </div>

            </div>

        </div>

        <!-- Mikrotik -->

        <div class="col-md-4">

            <div class="card dashboard-card h-100">

                <div class="card-body text-center">

                    <h3>🔴 Mikrotik</h3>

                    <button
                    class="btn btn-danger mt-3"
                    onclick="window.open('https://YOUR-MIKROTIK-IP','_blank')">

                    Open Config

                    </button>

                </div>

            </div>

        </div>

        <!-- Cisco -->

        <div class="col-md-4">

            <div class="card dashboard-card h-100">

                <div class="card-body text-center">

                    <h3>🟣 Cisco</h3>

                    <a
                        href="https://10.60.23.188/"
                        target="_blank"
                        class="btn btn-secondary mt-3">

                        Open Config

                    </a>

                </div>

            </div>

        </div>

        <!-- TP-Link -->

        <div class="col-md-4">

            <div class="card dashboard-card h-100">

                <div class="card-body text-center">

                    <h3>🟡 TP-Link</h3>

                    <a
                    href="https://omada.tplinkcloud.com"
                    target="_blank"
                    class="btn btn-info mt-3">

                    Open Config

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="../js/sidebar.js"></script>

<script type="module">

import { auth }
from "../js/firebase-config.js";

import {
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";

onAuthStateChanged(
auth,
(user)=>{

    if(!user){

        location.href =
        "../login.html";

    }

});

</script>

  <script src="/js/branding.js" defer></script>
</body>
</html>
