<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Network Home</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/sidebar.css">

<style>

.home-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
    margin-top:40px;
}

.home-card{

    background:#1b2945;
    border-radius:20px;
    padding:40px;
    text-align:center;

    cursor:pointer;

    transition:.3s;
}

.home-card:hover{

    transform:translateY(-8px);

    box-shadow:
    0 0 20px rgba(0,123,255,.4);
}

.home-icon{

    font-size:60px;
    margin-bottom:20px;
}

.home-title{

    font-size:28px;
    font-weight:700;
    color:white;
}

.home-count{

    font-size:40px;
    font-weight:bold;
    color:#0d6efd;
}

</style>

  <link rel="stylesheet" href="/css/branding.css">
</head>

<body>

<div id="sidebar-container"></div>

<div class="main-content">

    <h1 class="page-title">
        Network Management
    </h1>

    <div class="home-grid">

        <div class="home-card"
             onclick="location.href='pages/switches.html'">

            <div class="home-icon">
                🖧
            </div>

            <div class="home-title">
                Switch
            </div>

            <div class="home-count"
                 id="switchCount">
                0
            </div>

        </div>

        <div class="home-card"
             onclick="location.href='pages/accesspoint.html'">

            <div class="home-icon">
                📶
            </div>

            <div class="home-title">
                Access Point
            </div>

            <div class="home-count"
                 id="apCount">
                0
            </div>

        </div>

    </div>

</div>

<script type="module">

import { db } from "./js/firebase-config.js";

import {
collection,
getDocs
}
from
"https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

async function loadSummary(){

    const switchSnapshot =
    await getDocs(
        collection(db,"switches")
    );

    document.getElementById(
        "switchCount"
    ).innerText =
    switchSnapshot.size;

    try{

        const apSnapshot =
        await getDocs(
            collection(db,"accesspoints")
        );

        document.getElementById(
            "apCount"
        ).innerText =
        apSnapshot.size;

    }
    catch{

        document.getElementById(
            "apCount"
        ).innerText = "0";
    }
}

loadSummary();



</script>

<script src="js/sidebar.js"></script>

<script type="module">

import { auth }
from "./js/firebase-config.js";

import {
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";

onAuthStateChanged(
auth,
(user)=>{

    if(!user){

        window.location.href =
        "login.html";

    }

});
</script>

  <script src="/js/branding.js" defer></script>
</body>
</html>
