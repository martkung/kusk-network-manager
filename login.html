<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Network Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<style>

body{
    background:#0f172a;

    display:flex;
    justify-content:center;
    align-items:center;

    height:100vh;
}

.login-card{

    width:100%;
    max-width:400px;

    background:#1e293b;

    padding:30px;

    border-radius:20px;

    color:white;
}

</style>

  <link rel="stylesheet" href="/css/branding.css">
</head>

<body>

<div class="login-card">

    <h2 class="text-center mb-4">
        Network Login
    </h2>

    <input
    type="email"
    id="email"
    class="form-control mb-3"
    placeholder="Email">

    <input
    type="password"
    id="password"
    class="form-control mb-3"
    placeholder="Password">

    <button
    class="btn btn-primary w-100"
    onclick="login()">

    Login

    </button>

</div>

<script type="module">

import { auth }
from "./js/firebase-config.js";

import {
signInWithEmailAndPassword
}
from
"https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";

window.login =
async function(){

    const email =
    document.getElementById(
        "email"
    ).value;

    const password =
    document.getElementById(
        "password"
    ).value;

    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        location.href =
        "home.html";

    }
    catch(error){

        alert(
            "Login Failed : " +
            error.message
        );

    }

};

</script>

  <script src="/js/branding.js" defer></script>
</body>
</html>
