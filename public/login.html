<!DOCTYPE html>
<html lang="th" class="auth-pending">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Network Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet"
integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
crossorigin="anonymous">

<style>

html.auth-pending body{
    visibility:hidden;
}

body{
    background:#0f172a;

    display:flex;
    justify-content:center;
    align-items:center;

    height:100vh;
}

.login-card{

    width:100%;
    max-width:400px;

    background:#1e293b;

    padding:30px;

    border-radius:20px;

    color:white;
}

</style>

  <link rel="stylesheet" href="/css/branding.css?v=20260907-school-brand">
</head>

<body>

<form class="login-card" id="loginForm">

    <h2 class="text-center mb-4">
        Network Login
    </h2>

    <input
    type="email"
    id="email"
    class="form-control mb-3"
    autocomplete="username"
    required
    placeholder="Email">

    <input
    type="password"
    id="password"
    class="form-control mb-3"
    autocomplete="current-password"
    required
    placeholder="Password">

    <div id="loginError" class="text-danger mb-3" role="alert"></div>

    <button
    type="submit"
    id="loginButton"
    class="btn btn-primary w-100"
    >

    Login

    </button>

    <a
    href="/home.html"
    class="btn btn-outline-light w-100 mt-3">
    ดูข้อมูลสาธารณะ
    </a>

</form>

<script type="module" src="js/login.js?v=20260928-viewer2"></script>

  <script src="/js/branding.js?v=20260907-school-brand" defer></script>
</body>
</html>
