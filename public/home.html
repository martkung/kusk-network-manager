<!DOCTYPE html>
<html lang="th" class="auth-pending">

<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Network Home</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
crossorigin="anonymous">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/sidebar.css">
<link rel="stylesheet" href="/css/agent-health.css">

<style>

.home-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
    margin-top:40px;
}

.home-card{

    background:#1b2945;
    border-radius:20px;
    padding:40px;
    text-align:center;

    cursor:pointer;

    transition:.3s;
    text-decoration:none;
}

.home-card:hover{

    transform:translateY(-8px);

    box-shadow:
    0 0 20px rgba(0,123,255,.4);
}

.home-icon{

    font-size:60px;
    margin-bottom:20px;
}

.home-title{

    font-size:28px;
    font-weight:700;
    color:white;
}

.home-count{

    font-size:40px;
    font-weight:bold;
    color:#0d6efd;
}

</style>

  <link rel="stylesheet" href="/css/branding.css?v=20260907-school-brand">
</head>

<body>

<div id="sidebar-container"></div>

<div class="main-content">

    <h1 class="page-title">
        Network Management
    </h1>

    <div id="agentHealthNotice" hidden></div>

    <div id="publicGuestNotice" class="alert alert-info mt-4" role="status" hidden>
        กำลังแสดงข้อมูลสาธารณะที่ไม่ระบุตัวอุปกรณ์หรือสถานที่
        <a href="/login.html?signin=1" class="alert-link">เข้าสู่ระบบเพื่อดูข้อมูลตามสิทธิ์</a>
    </div>

    <div id="accessPending" class="alert alert-info mt-4" role="status" hidden>
        บัญชีนี้ยังไม่ได้รับสิทธิ์เข้าถึงข้อมูลอุปกรณ์ กรุณาติดต่อผู้ดูแลระบบ
    </div>

    <div id="inventoryCards" class="home-grid">

        <a class="home-card"
             href="pages/switches.html">

            <div class="home-icon">
                🖧
            </div>

            <div class="home-title">
                Switch
            </div>

            <div class="home-count"
                 id="switchCount">
                0
            </div>

        </a>

        <a class="home-card"
             href="pages/accesspoint.html">

            <div class="home-icon">
                📶
            </div>

            <div class="home-title">
                Access Point
            </div>

            <div class="home-count"
                 id="apCount">
                0
            </div>

        </a>

    </div>

</div>

<script src="js/sidebar.js?v=20260928-viewer2"></script>
<script type="module" src="js/home.js?v=20260928-viewer2"></script>

  <script src="/js/branding.js?v=20260907-school-brand" defer></script>

</html>
