<!DOCTYPE html>
<html lang="th" class="auth-pending">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Network Switch Manager</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous">

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/sidebar.css">
<link rel="stylesheet" href="../css/modal.css">

  <link rel="stylesheet" href="/css/branding.css?v=20260907-school-brand">
</head>

<body>

<div id="sidebar-container"></div>

<div class="main-content">

    <h1 class="page-title">
        Network Switch Manager
    </h1>

    <div id="publicGuestNotice" class="alert alert-info mb-4" role="status" hidden>
        ผู้เยี่ยมชมจะเห็นเฉพาะยี่ห้อ รุ่น และสถานะ ไม่แสดงชื่ออุปกรณ์ สถานที่ รูปภาพ
        หรือข้อมูลเครือข่าย
        <a href="/login.html?signin=1" class="alert-link">เข้าสู่ระบบเพื่อดูข้อมูลตามสิทธิ์</a>
    </div>

    <!-- Dashboard Summary -->

<div class="row g-4 mb-4">

    <div class="col-md-3">

        <div class="card dashboard-card">

            <div class="card-body">

                <div class="card-title-small">
                    Total Switches
                </div>

                <div
                class="card-number"
                id="switchCount">

                0

                </div>

            </div>

        </div>

    </div>

    <div class="col-md-3">

        <div class="card dashboard-card">

            <div class="card-body">

                <div class="card-title-small">
                    Online
                </div>

                <div
                class="card-number text-success"
                id="onlineCount">

                0

                </div>

            </div>

        </div>

    </div>

    <div class="col-md-3">

        <div class="card dashboard-card">

            <div class="card-body">

                <div class="card-title-small">
                    Offline
                </div>

                <div
                class="card-number text-danger"
                id="offlineCount">

                0

                </div>

            </div>

        </div>

    </div>

    <div class="col-md-3">

        <div class="card dashboard-card">

            <div class="card-body">

                <div class="card-title-small">
                    Availability
                </div>

                <div
                class="card-number text-warning"
                id="availabilityPercent">

                0%

                </div>

            </div>

        </div>

    </div>

    </div>

    <!-- Header -->

    
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap">

    <h3>Switch List</h3>

        <div class="d-flex gap-2">

            <input
                type="search"
                id="searchBox"
                class="form-control"
                placeholder="ค้นหาชื่อ ยี่ห้อ รุ่น หรือสถานที่"
                autocomplete="off"
                spellcheck="false"
                autocorrect="off"
                autocapitalize="off"
                style="width:300px;">

            <button
            type="button"
            id="newDeviceButton"
            class="btn btn-primary">

            + Add Device

            </button>

        </div>

    </div>

    <!-- Table -->

    <div class="table-container">

        <table
        class="table table-dark table-hover align-middle">

           <thead>
             <tr>
                <th data-name-column>Name</th>
                <th>Brand</th>
                <th>Model</th>
                <th data-private-column>IP Address</th>
                <th data-private-column>MAC Address</th>
                <th>Status</th>
                <th>Updated</th>
                <th>Config</th>
                <th>Actions</th>
             </tr>
            </thead>

            <tbody id="switchTable">

            </tbody>

        </table>

    </div>

</div>

<div id="modal-container"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

<script src="../js/sidebar.js?v=20260928-viewer2"></script>

<script type="module"
src="../js/app.js?v=20260928-viewer2">
</script>

  <script src="/js/branding.js?v=20260907-school-brand" defer></script>
</body>

</html>
