<!DOCTYPE html>
<html lang="th" class="auth-pending">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Access Point</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous">

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/sidebar.css">

  <link rel="stylesheet" href="/css/branding.css?v=20260907-school-brand">
</head>

<body>

<div id="sidebar-container"></div>

<div class="main-content">

    <h1 class="page-title mb-4">
        📶 Access Point Management
    </h1>

    <div id="accessPointNotice" class="alert alert-info" role="status"></div>

    <div class="row g-4">

        <!-- Zyxel -->

        <div class="col-md-4">

            <div class="card dashboard-card h-100">

                <div class="card-body text-center">

                    <h3>🟢 Zyxel</h3>

                    <a
                        target="_blank"
                        rel="noopener noreferrer"
                        data-config-link="zyxel"
                        hidden
                        class="btn btn-primary mt-3">

                        Open Config

                    </a>

                </div>

            </div>

        </div>

        <!-- UniFi -->

        <div class="col-md-4">

            <div class="card dashboard-card h-100">

                <div class="card-body text-center">

                    <h3>🔵 UniFi</h3>

                    <a
                        target="_blank"
                        rel="noopener noreferrer"
                        data-config-link="unifi"
                        hidden
                        class="btn btn-primary mt-3">

                        Open Config

                    </a>

                </div>

            </div>

        </div>

        <!-- Cambium -->

        <div class="col-md-4">

            <div class="card dashboard-card h-100">

                <div class="card-body text-center">

                    <h3>🟠 Cambium</h3>

                    <a
                        target="_blank"
                        rel="noopener noreferrer"
                        data-config-link="cambium"
                        hidden
                        class="btn btn-warning mt-3">

                        Open Config

                    </a>

                </div>

            </div>

        </div>

        <!-- Mikrotik -->

        <div class="col-md-4">

            <div class="card dashboard-card h-100">

                <div class="card-body text-center">

                    <h3>🔴 Mikrotik</h3>

                    <span
                    class="btn btn-danger mt-3 disabled"
                    aria-disabled="true"
                    title="ยังไม่ได้กำหนดที่อยู่ Mikrotik">

                    Not Configured

                    </span>

                </div>

            </div>

        </div>

        <!-- Cisco -->

        <div class="col-md-4">

            <div class="card dashboard-card h-100">

                <div class="card-body text-center">

                    <h3>🟣 Cisco</h3>

                    <a
                        target="_blank"
                        rel="noopener noreferrer"
                        data-config-link="cisco"
                        hidden
                        class="btn btn-secondary mt-3">

                        Open Config

                    </a>

                </div>

            </div>

        </div>

        <!-- TP-Link -->

        <div class="col-md-4">

            <div class="card dashboard-card h-100">

                <div class="card-body text-center">

                    <h3>🟡 TP-Link</h3>

                    <a
                    target="_blank"
                    rel="noopener noreferrer"
                    data-config-link="tplink"
                    hidden
                    class="btn btn-info mt-3">

                    Open Config

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="../js/sidebar.js?v=20260928-viewer2"></script>

<script type="module" src="../js/accesspoint.js?v=20260928-viewer2"></script>

  <script src="/js/branding.js?v=20260907-school-brand" defer></script>
