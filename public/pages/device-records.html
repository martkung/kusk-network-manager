<!DOCTYPE html>
<html lang="th" class="auth-pending">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ประวัติข้อมูลและถังขยะ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/sidebar.css">
    <link rel="stylesheet" href="/css/branding.css?v=20260907-school-brand">
    <link rel="stylesheet" href="/css/device-records.css?v=20261015-audit2">
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
</head>
<body>
    <div id="sidebar-container"></div>
    <main class="main-content records-page">
        <h1 class="page-title">ประวัติข้อมูลและถังขยะ</h1>
        <div id="recordsError" class="alert alert-danger" role="alert" hidden></div>
        <div id="recordsSuccess" class="alert alert-success" role="status" hidden></div>
        <div class="records-toolbar">
            <div class="records-tabs" role="tablist" aria-label="ประวัติอุปกรณ์">
                <button id="auditTab" type="button" role="tab" aria-controls="auditPanel" aria-selected="true">ประวัติการแก้ไข</button>
                <button id="trashTab" type="button" role="tab" aria-controls="trashPanel" aria-selected="false" tabindex="-1">ถังขยะ</button>
            </div>
            <select id="recordsDevice" class="form-select" aria-label="อุปกรณ์"><option value="">ทุกอุปกรณ์</option></select>
        </div>
        <p id="recordsStatus" class="records-status" role="status">กำลังโหลดข้อมูล...</p>
        <section id="auditPanel" role="tabpanel" aria-labelledby="auditTab">
            <div class="records-scroll">
                <table class="records-table">
                    <thead><tr><th>เวลา</th><th>อุปกรณ์</th><th>รายการ</th><th>ผู้ดำเนินการ</th><th>รายละเอียด</th></tr></thead>
                    <tbody id="auditRows"></tbody>
                </table>
            </div>
        </section>
        <section id="trashPanel" role="tabpanel" aria-labelledby="trashTab" hidden>
            <div class="records-scroll">
                <table class="records-table">
                    <thead><tr><th>อุปกรณ์</th><th>เวลาลบ</th><th>ผู้ลบ</th><th>เหตุผล</th><th>จัดการ</th></tr></thead>
                    <tbody id="trashRows"></tbody>
                </table>
            </div>
        </section>
        <div class="records-pagination"><button id="recordsMore" class="btn btn-outline-light" type="button" hidden>โหลดเพิ่ม</button></div>
    </main>
    <script src="/js/sidebar.js?v=20261015-audit1"></script>
    <script type="module" src="/js/device-records.js"></script>
    <script src="/js/branding.js?v=20260907-school-brand" defer></script>
</body>
</html>
