<!DOCTYPE html>
<html lang="th" class="auth-pending">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>สถานะและแจ้งเตือน</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/sidebar.css">
    <link rel="stylesheet" href="/css/branding.css?v=20260907-school-brand">
    <link rel="stylesheet" href="/css/agent-health.css">
    <link rel="stylesheet" href="/css/monitoring.css">
</head>
<body>
    <div id="sidebar-container"></div>
    <main class="main-content monitoring-page">
        <h1 class="page-title">สถานะและแจ้งเตือน</h1>
        <div id="agentHealthNotice" hidden></div>
        <div id="monitoringError" class="alert alert-danger" role="alert" hidden></div>
        <section class="incident-overview" aria-label="เหตุการณ์ที่เปิดอยู่">
            <div><span>Offline ต่อเนื่อง</span><strong id="activeIncidentCount">-</strong></div>
            <div><span>ยังไม่รับทราบ</span><strong id="unacknowledgedCount">-</strong></div>
        </section>
        <div class="monitoring-toolbar">
            <div class="monitoring-tabs" role="tablist" aria-label="ข้อมูลสถานะ">
                <button id="incidentsTab" type="button" role="tab" aria-selected="true"
                    aria-controls="incidentsPanel">แจ้งเตือน</button>
                <button id="historyTab" type="button" role="tab" aria-selected="false"
                    aria-controls="historyPanel" tabindex="-1">ประวัติสถานะ</button>
            </div>
            <div class="monitoring-filters">
                <select id="monitorDevice" class="form-select" aria-label="อุปกรณ์">
                    <option value="">ทุกอุปกรณ์</option>
                </select>
                <select id="incidentStatus" class="form-select" aria-label="สถานะเหตุการณ์">
                    <option value="open">เปิดอยู่</option>
                    <option value="">ทั้งหมด</option>
                    <option value="resolved">กลับมา Online</option>
                    <option value="closed">ปิดเหตุการณ์</option>
                </select>
            </div>
        </div>
        <p id="monitoringStatus" class="monitoring-status" role="status">กำลังโหลดข้อมูล...</p>
        <section id="incidentsPanel" role="tabpanel" aria-labelledby="incidentsTab">
            <div class="monitoring-table-wrap">
                <table class="monitoring-table">
                    <thead><tr>
                        <th>อุปกรณ์</th><th>เหตุการณ์</th><th>เริ่ม Offline</th>
                        <th>ช่วง Offline</th><th>ตรวจล่าสุด</th><th>รับทราบ</th>
                    </tr></thead>
                    <tbody id="incidentsTable"></tbody>
                </table>
            </div>
        </section>
        <section id="historyPanel" role="tabpanel" aria-labelledby="historyTab" hidden>
            <div class="monitoring-table-wrap">
                <table class="monitoring-table">
                    <thead><tr>
                        <th>เวลาตรวจ</th><th>อุปกรณ์</th><th>สถานะเดิม</th>
                        <th>สถานะใหม่</th><th>เหตุการณ์</th>
                    </tr></thead>
                    <tbody id="historyTable"></tbody>
                </table>
            </div>
        </section>
        <div class="monitoring-pagination">
            <button id="loadMoreMonitoring" class="btn btn-outline-light" type="button" hidden>โหลดเพิ่ม</button>
        </div>
    </main>
    <script src="/js/sidebar.js?v=20261012-incidents1"></script>
    <script type="module" src="/js/monitoring.js"></script>
    <script src="/js/branding.js?v=20260907-school-brand" defer></script>
</body>
</html>
